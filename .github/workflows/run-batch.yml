# 日次バッチの手動実行（Lambda を非同期で 1 回起動するだけ。Terraform もデプロイも行わない）。
# Bedrock の従量課金が発生し得るため、承認必須の Environment "production" で実行する。
# 当日分があればスキップ。force=true でも要約キャッシュを再利用し、AI 呼び出しは日次上限内に収まる。
name: Run daily batch

on:
  workflow_dispatch:
    inputs:
      force:
        description: 当日分を作り直す（要約キャッシュを再利用）
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: run-batch
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
      - name: Invoke (async)
        env:
          FN: ${{ vars.BATCH_FUNCTION_NAME }}
          FORCE: ${{ inputs.force }}
        run: |
          payload=$([ "$FORCE" = "true" ] && echo '{"force":true}' || echo '{}')
          aws lambda invoke --function-name "$FN" --invocation-type Event \
            --cli-binary-format raw-in-base64-out --payload "$payload" /dev/null
          echo "Invoked $FN with $payload. Logs: aws logs tail /aws/lambda/$FN --since 30m" >> "$GITHUB_STEP_SUMMARY"
