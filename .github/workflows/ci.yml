# コード検証のみ。AWS へのアクセス・イメージ push・課金は行わない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Next.js static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check static export contains no data
        run: test -f out/index.html && test -f out/404.html && test ! -e out/data
      - run: npm run build:batch
      - name: Offline batch smoke test (no network, no AI)
        run: npm run batch:offline
        env:
          LOCAL_PUBLIC_DIR: ${{ runner.temp }}/digest/public
          LOCAL_INTERNAL_DIR: ${{ runner.temp }}/digest/internal

  lambda-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Lambda image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.lambda
          push: false
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=lambda
          cache-to: type=gha,mode=max,scope=lambda

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive infra
      - name: Validate (no backend, no AWS access)
        run: |
          for d in infra/bootstrap infra/app; do
            terraform -chdir=$d init -backend=false -input=false -lockfile=readonly
            terraform -chdir=$d validate
          done
