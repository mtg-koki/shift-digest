# コード検証のみ。外部公開（イメージ push）・Azure へのアクセス・課金は行わない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run build:batch
      - name: Offline batch smoke test (no network, no AI)
        run: npm run batch:offline
        env:
          LOCAL_DATA_DIR: ${{ runner.temp }}/digest-data

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, batch]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.target }} image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.target }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive infra
      - name: Validate (no backend, no Azure access)
        run: |
          for d in infra/bootstrap infra/app; do
            terraform -chdir=$d init -backend=false -input=false -lockfile=readonly
            terraform -chdir=$d validate
          done
