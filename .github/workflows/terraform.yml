# Terraform plan / apply（手動実行のみ。自動 apply はしない。destroy は CI では行わない＝README の手順で手元から）。
# - plan : GitHub Environment "plan"（読み取り専用ロール。state のロックファイルだけ書ける）
# - apply: GitHub Environment "production"（必須レビュアーの承認後。承認後に plan を作り直し、その plan をそのまま apply）
# plan ファイルはランナー内だけで使い、アーティファクトとして保存しない。
# 注意: 公開リポジトリのワークフローログは誰でも読める。メールアドレス等は sensitive 変数で渡し、plan に表示させない。
name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan or apply
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  id-token: write # OIDC

concurrency:
  group: terraform-app
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
  TF_VAR_permissions_boundary_arn: ${{ vars.APP_PERMISSIONS_BOUNDARY_ARN }}
  TF_VAR_bedrock_model_id: ${{ vars.BEDROCK_MODEL_ID }}
  # 個人のメールアドレスはリポジトリに書かず、Environment secret から JSON 配列で渡す（例: ["a@example.com"]）
  TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS || '[]' }}
  TF_VAR_budget_emails: ${{ secrets.BUDGET_EMAILS || '[]' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: plan
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - name: Init
        run: >
          terraform -chdir=infra/app init -input=false -lockfile=readonly
          -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"
          -backend-config="key=app.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - name: Plan
        run: terraform -chdir=infra/app plan -input=false -lock-timeout=5m -no-color

  apply:
    if: inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - name: Init
        run: >
          terraform -chdir=infra/app init -input=false -lockfile=readonly
          -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"
          -backend-config="key=app.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - name: Plan (re-created after approval; stays inside the runner)
        run: terraform -chdir=infra/app plan -input=false -lock-timeout=5m -no-color -out="$RUNNER_TEMP/tfplan"
      - name: Apply
        run: terraform -chdir=infra/app apply -input=false -lock-timeout=5m -no-color "$RUNNER_TEMP/tfplan"
      - name: Remove plan file
        if: always()
        run: rm -f "$RUNNER_TEMP/tfplan"
